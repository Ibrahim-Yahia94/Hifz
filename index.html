<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><title>رفيق الحفظ</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.json"><meta name="theme-color" content="#1d6b4f">
<style>
:root{--bg:#fbf8f1;--fg:#1f2a24;--card:#fff;--ac:#1d6b4f;--mut:#6b756f;--ok:#1d8a4f;--bad:#c0392b;--bd:#e3ddd0;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root{--bg:#141a17;--fg:#ecefe9;--card:#1d2621;--ac:#4fc08d;--mut:#9aa59e;--ok:#4fc08d;--bad:#ff7b6b;--bd:#2d3832}}
body{margin:0;background:var(--bg);color:var(--fg);font:16px system-ui,sans-serif;max-width:560px;margin-inline:auto;padding:12px}
h1{font-size:20px;margin:6px 0}.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px;margin:10px 0}
select,button,input,textarea{font:inherit;padding:10px;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--fg)}
button.p{background:var(--ac);color:#fff;border:0}.tabs{display:flex;gap:6px}.tabs button{flex:1}.tabs .on{background:var(--ac);color:#fff}
.ay{font:22px/2.1 "Amiri","Traditional Arabic",serif;border-bottom:1px dashed var(--bd);display:flex;gap:8px;align-items:center;justify-content:space-between}
.ay.m{color:var(--ok)}.bar{height:8px;background:var(--bd);border-radius:6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ac)}
.w{font:24px/2.2 serif;padding:0 3px;border-radius:6px}.w.g{color:var(--ok)}.w.r{color:var(--bad);background:rgba(192,57,43,.12);text-decoration:underline}
.mut{color:var(--mut);font-size:14px}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
</style></head><body>
<h1>📖 رفيق الحفظ</h1>
<div class="row"><select id="rw"><option value="h">حفص عن عاصم</option><option value="s">شعبة عن عاصم</option><option value="q">قالون عن نافع</option></select>
<select id="sr"></select></div>
<div class="tabs card"><button data-t="a" class="on">الحفظ</button><button data-t="b">التسميع</button><button data-t="c">المراجعة</button></div>
<div id="a" class="card"></div>
<div id="b" class="card" hidden>
<div class="row"><select id="ay"></select><button id="nx">التالية ›</button><button class="p" id="mic">🎤 سمّع</button></div>
<p class="mut" id="st">اضغط الميكروفون وابدأ القراءة، أو اكتب/أملِ بميكروفون لوحة المفاتيح في الخانة أدناه.</p>
<div id="res"></div><div class="mut" id="ex"></div>
<textarea id="man" placeholder="ما قرأته" style="width:100%;min-height:56px;margin-top:8px;box-sizing:border-box"></textarea>
<button id="cmp" style="margin-top:6px">قارن</button></div>
<div id="c" class="card" hidden>
<div id="du"></div><hr style="border-color:var(--bd)">
<p>تذكير يومي (يعمل والتطبيق مفتوح):</p><div class="row"><input type="time" id="tm" value="06:00"><button class="p" id="rm">تفعيل</button></div><p class="mut" id="rs"></p></div>
<script>
const N="الفاتحة,البقرة,آل عمران,النساء,المائدة,الأنعام,الأعراف,الأنفال,التوبة,يونس,هود,يوسف,الرعد,إبراهيم,الحجر,النحل,الإسراء,الكهف,مريم,طه,الأنبياء,الحج,المؤمنون,النور,الفرقان,الشعراء,النمل,القصص,العنكبوت,الروم,لقمان,السجدة,الأحزاب,سبأ,فاطر,يس,الصافات,ص,الزمر,غافر,فصلت,الشورى,الزخرف,الدخان,الجاثية,الأحقاف,محمد,الفتح,الحجرات,ق,الذاريات,الطور,النجم,القمر,الرحمن,الواقعة,الحديد,المجادلة,الحشر,الممتحنة,الصف,الجمعة,المنافقون,التغابن,الطلاق,التحريم,الملك,القلم,الحاقة,المعارج,نوح,الجن,المزمل,المدثر,القيامة,الإنسان,المرسلات,النبأ,النازعات,عبس,التكوير,الانفطار,المطففين,الانشقاق,البروج,الطارق,الأعلى,الغاشية,الفجر,البلد,الشمس,الليل,الضحى,الشرح,التين,العلق,القدر,البينة,الزلزلة,العاديات,القارعة,التكاثر,العصر,الهمزة,الفيل,قريش,الماعون,الكوثر,الكافرون,النصر,المسد,الإخلاص,الفلق,الناس".split(",");
const $=i=>document.getElementById(i),IV=[1,3,7,14,30];let D={};
const ld=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))||d}catch(e){return d}};
let M=ld("hm",{}),R=ld("hr",{});const sv=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
N.forEach((n,i)=>$("sr").add(new Option((i+1)+". "+n,i+1)));
const rw=()=>$("rw").value,sr=()=>+$("sr").value,A=()=>(D[rw()]||{})[sr()]||[],K=i=>rw()+":"+sr()+":"+(i+1);
async function load(){$("a").textContent="جارٍ التحميل...";
if(!D[rw()]){try{D[rw()]=await(await fetch("data/data/"+rw()+".json")).json()}catch(e){$("a").textContent="تعذر تحميل بيانات الرواية (مجلد data).";return}}draw()}
function draw(){const a=A();let d=0,h="";a.forEach((t,i)=>{const m=M[K(i)];if(m)d++;h+=`<div class="ay ${m?"m":""}"><span>${t} ﴿${i+1}﴾</span><button data-k="${i}">${m?"✓":"○"}</button></div>`});
$("a").innerHTML=`<div class="mut">محفوظ ${d} من ${a.length}</div><div class="bar"><i style="width:${a.length?d/a.length*100:0}%"></i></div>`+h;
$("ay").innerHTML="";a.forEach((_,i)=>$("ay").add(new Option("آية "+(i+1),i)));$("res").innerHTML="";$("ex").textContent=""}
$("a").onclick=e=>{const i=e.target.dataset.k;if(i==null)return;const k=K(+i);if(M[k])delete M[k];else M[k]={d:Date.now(),n:0};sv("hm",M);draw()};
function tab(t){document.querySelectorAll(".tabs button").forEach(b=>b.classList.toggle("on",b.dataset.t===t));["a","b","c"].forEach(x=>$(x).hidden=x!==t);if(t==="c")due()}
document.querySelector(".tabs").onclick=e=>e.target.dataset.t&&tab(e.target.dataset.t);
$("rw").onchange=$("sr").onchange=load;
$("nx").onclick=()=>{const s=$("ay");if(s.selectedIndex<s.options.length-1){s.selectedIndex++;$("res").innerHTML="";$("man").value=""}};
const norm=t=>t.replace(/[\u0610-\u061A\u064B-\u065F\u0670\u06D6-\u06ED\u0640]/g,"").replace(/[أإآٱ]/g,"ا").replace(/ى/g,"ي").replace(/ؤ/g,"و").replace(/ئ/g,"ي").replace(/ة/g,"ه").replace(/[^\u0621-\u064A\s]/g,"").trim().split(/\s+/).filter(Boolean);
function compare(said){const i=+$("ay").value,E=(A()[i]||"").split(/\s+/),e=E.map(w=>norm(w).join("")),r=norm(said),n=e.length,m=r.length,D2=Array.from({length:n+1},()=>Array(m+1).fill(0));
for(let a=n-1;a>=0;a--)for(let b=m-1;b>=0;b--)D2[a][b]=e[a]===r[b]?D2[a+1][b+1]+1:Math.max(D2[a+1][b],D2[a][b+1]);
const ok=Array(n).fill(0),u=Array(m).fill(0);let a=0,b=0;while(a<n&&b<m){if(e[a]===r[b]){ok[a]=1;u[b]=1;a++;b++}else if(D2[a+1][b]>=D2[a][b+1])a++;else b++}
$("res").innerHTML=E.map((w,j)=>`<span class="w ${ok[j]?"g":"r"}">${w}</span>`).join(" ");
const x=r.filter((_,j)=>!u[j]),c=ok.filter(Boolean).length,pass=c===n&&!x.length;
$("ex").textContent=(pass?"✅ قراءة صحيحة":`الصحيح ${c} من ${n}. الأحمر ناقص أو مبدَّل.`)+(x.length?" زائد: "+x.join("، "):"");
if(pass){const k=K(i),v=M[k];M[k]={d:Date.now(),n:v?v.n+1:0};sv("hm",M)}}
$("cmp").onclick=()=>compare($("man").value);
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
$("mic").onclick=()=>{if(!SR){$("st").textContent="المتصفح لا يدعم التعرف الصوتي. استخدم ميكروفون لوحة المفاتيح في الخانة.";return}
const r=new SR();r.lang="ar-SA";r.onstart=()=>$("st").textContent="🎙️ أسمعك...";r.onresult=e=>{const t=e.results[0][0].transcript;$("man").value=t;$("st").textContent="سُمع: "+t;compare(t)};r.onerror=e=>$("st").textContent="تعذر التسجيل: "+e.error+". جرّب إملاء لوحة المفاتيح.";r.start()};
function due(){const now=Date.now(),L=Object.entries(M).filter(([k,v])=>now-v.d>=IV[Math.min(v.n,4)]*864e5);
$("du").innerHTML=L.length?`<p>مستحق للمراجعة: ${L.length} آية</p>`+L.slice(0,15).map(([k])=>{const[r,s,a]=k.split(":");return`<button data-g="${k}" style="margin:3px">${N[s-1]} ${a}</button>`}).join(""):"<p>لا مراجعات مستحقة اليوم 🌿</p>"}
$("du").onclick=async e=>{const g=e.target.dataset.g;if(!g)return;const[r,s,a]=g.split(":");$("rw").value=r;$("sr").value=s;await load();$("ay").value=a-1;tab("b")};
if(R.t){$("tm").value=R.t;$("rs").textContent="مفعّل: "+R.t}
$("rm").onclick=async()=>{R.t=$("tm").value;sv("hr",R);let p="denied";try{p=await Notification.requestPermission()}catch(e){}$("rs").textContent=p==="granted"?"✅ مفعّل: "+R.t:"فعّل الإشعارات من إعدادات المتصفح"};
setInterval(()=>{if(!R.t||typeof Notification==="undefined"||Notification.permission!=="granted")return;const d=new Date();if(d.toTimeString().slice(0,5)===R.t&&R.d!==d.toDateString()){R.d=d.toDateString();sv("hr",R);new Notification("📖 وقت الحفظ",{body:"وردك ينتظرك، وفيه مراجعات مستحقة."})}},20000);
if("serviceWorker"in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
load();
</script></body></html>
